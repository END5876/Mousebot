; docker/supervisord.conf：容器內 supervisord 的設定範本
; @BGUTIL_AUTOSTART@ 與 @OWW_AUTOSTART@ 由 docker/entrypoint.sh 依 FEATURES 代入（node utils/features.js supervisor），
; 產生的設定寫到 /etc/supervisor/conf.d/supervisord.conf。
; fatal-listener：子程序重試到放棄（FATAL）時結束 supervisord，讓 Docker 重啟整個容器
; （細節與例外見 docker/fatal-listener.py）。它以 root 執行，才能對 supervisord 送訊號。
[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info

[program:bgutil-pot]
command=node /opt/bgutil/build/main.js
directory=/opt/bgutil
autostart=@BGUTIL_AUTOSTART@
autorestart=true
startretries=5
startsecs=3
priority=1
user=bot
environment=HOME="/home/bot",USER="bot"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:oww-server]
command=/opt/oww-env/bin/python3 /app/oww-server/server.py
directory=/app/oww-server
autostart=@OWW_AUTOSTART@
autorestart=true
startretries=5
startsecs=5
priority=1
user=bot
environment=HOME="/home/bot",USER="bot"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[eventlistener:fatal-listener]
command=/usr/bin/python3 /app/docker/fatal-listener.py
events=PROCESS_STATE_FATAL
autostart=true
autorestart=true
stdout_logfile=NONE
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:node-bot]
command=node /app/index.js
directory=/app
autostart=true
autorestart=true
startretries=5
startsecs=8
priority=10
user=bot
environment=HOME="/home/bot",USER="bot"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
